name: Build Fabric Mod

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Fabric Template
        run: |
          mkdir -p workspace
          git clone https://github.com/FabricMC/fabric-example-mod.git workspace
          mkdir -p workspace/src/main/java/com/example/titlemod/config
          mkdir -p workspace/src/main/java/com/example/titlemod/mixin
          
          # Copy your custom java files into the Fabric workspace
          cp -f src/main/java/com/example/titlemod/config/TitleConfig.java workspace/src/main/java/com/example/titlemod/config/ 2>/dev/null || true
          cp -f src/main/java/com/example/titlemod/mixin/TitleScaleMixin.java workspace/src/main/java/com/example/titlemod/mixin/ 2>/dev/null || true
          
          # Add mixin entry to fabric template mixin config
          sed -i 's/"client": \[/"client": \[\n    "com.example.titlemod.mixin.TitleScaleMixin",/g' workspace/src/main/resources/modid.mixins.json

      - name: Grant execute permission for gradlew
        run: chmod +x workspace/gradlew

      - name: Build with Gradle
        run: |
          cd workspace
          ./gradlew build --no-daemon

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: TitleScaler-Fabric-Mod
          path: workspace/build/libs/*.jar
